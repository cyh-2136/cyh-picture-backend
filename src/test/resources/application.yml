#服务器配置
server:
  port: 8123
# 上下文路径:localhost:8123/api
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
logging:
  level:
    com.cyh: info  # 确保包路径正确


#项目配置
spring:
  application:
    name: cyh-picture-backend

  # session 配置
  session:
    store-type: redis
    # session 30 天过期（单位：秒）
    timeout: 2592000


  #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cyh_picture
    username: root
    password: chengyuhan2136

  # Redis 配置
  redis:
    database: 3
    host: localhost
    port: 6379
    timeout: 5000
    password: 123456


  # 空间图片分表
  shardingsphere:
    datasource:
      names: cyh_picture
      cyh_picture:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/cyh_picture
        username: root
        password: chengyuhan2136
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: cyh_picture.picture  # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm  # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: standard
              algorithmClassName: com.cyh.cyhpicturebackend.manager.sharding.PictureShardingAlgorithm
    props:
      sql-show: true


  # 文件上传配置(默认1MB)
  servlet:
    multipart:
      max-file-size: 10MB

#  profiles:
#    active: local

mybatis-plus:
  configuration:
    # MyBatis 配置
    #驼峰命名转换
    map-underscore-to-camel-case: false
    #开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # 全局配置
  global-config:
    db-config:
      # 逻辑删除字段名
      logic-delete-field: isDelete
      # 逻辑删除值（默认值为 1）
      logic-delete-value: 1
      # 逻辑未删除值（默认值为 0）
      logic-not-delete-value: 0
    # 开启SQL运行器
    enable-sql-runner: true



#访问http://localhost:8123/api/doc.html#/home
# 开启Knife4j
knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      #目前只有一个组
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.cyh.cyhpicturebackend.controller


